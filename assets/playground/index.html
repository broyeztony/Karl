<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Karl</title>
    <style>
        :root {
            --ink: #1e1e1e;
            --accent-a: #bd93f9;
            --accent-b: #ff79c6;
            --line: #e6e6e6;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            font-family: Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-weight: lighter;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            color: var(--ink);
        }

        .page {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
        }

        .left {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            min-height: 0;
        }

        .left a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-decoration: none;
        }

        .left img {
            width: min(36%, 260px);
            height: auto;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        .right {
            border-left: none;
            min-width: 0;
            min-height: 0;
            padding: 34px 40px;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            position: relative;
        }

        .cta-links {
            position: absolute;
            bottom: 14px;
            right: 18px;
            z-index: 6;
            display: inline-flex;
            gap: 14px;
            align-items: center;
        }

        .github-link {
            position: absolute;
            bottom: 14px;
            left: 18px;
            z-index: 6;
        }

        .cta-links a,
        .github-link {
            text-decoration: none;
            color: var(--ink);
            font-size: 12px;
            line-height: 1;
            opacity: 0.8;
            transition: opacity 140ms ease, color 140ms ease;
        }

        .cta-links a:hover,
        .cta-links a:focus-visible,
        .github-link:hover,
        .github-link:focus-visible {
            color: var(--accent-a);
            opacity: 1;
            outline: none;
        }

        #example {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            overflow-x: hidden;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
            color: var(--ink);
            font-size: clamp(14px, 1.45vw, 24px);
            line-height: 1.55;
            opacity: 1;
            transition: opacity 180ms ease;
        }

        .progress {
            position: fixed;
            left: 50%;
            top: 0;
            bottom: 0;
            transform: translateX(-50%);
            width: 2px;
            height: 100vh;
            background: transparent;
            overflow: hidden;
            z-index: 5;
            pointer-events: none;
        }

        .progress__bar {
            width: 100%;
            height: 100%;
            background: rgb(30, 30, 30);
            transform: scaleY(0);
            transform-origin: center bottom;
        }

        .tok-keyword,
        .tok-operator {
            color: var(--accent-a);
        }

        .tok-string,
        .tok-number,
        .tok-call {
            color: var(--accent-b);
        }

        .tok-comment {
            color: var(--ink);
            opacity: 0.58;
        }

        @media (max-width: 980px) {
            .page {
                grid-template-columns: 1fr;
            }

            .left {
                display: none;
            }

            .right {
                border-left: none;
                padding: 18px 16px;
            }

            .cta-links {
                bottom: 10px;
                right: 12px;
            }

            .github-link {
                bottom: 10px;
                left: 12px;
            }

            .progress {
                left: auto;
                right: 8px;
                top: 0;
                bottom: 0;
                transform: none;
                height: 100vh;
            }

            #example {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <main class="page" aria-label="Karl landing page">
        <section class="left" aria-label="Karl logo">
            <a href="/bench/" aria-label="Open Karl bench playground">
                <img src="karl.png" alt="Karl logo">
            </a>
        </section>
        <section class="right" aria-label="Karl feature examples">
            <a class="github-link" href="https://github.com/broyeztony/Karl">Github</a>
            <nav class="cta-links" aria-label="Karl quick links">
                <a href="/bench/">Try in your browser</a>
                <a href="/docs/">Docs</a>
                <a href="/sheets/">Open Karl Sheets</a>
            </nav>
            <pre id="example"></pre>
            <div class="progress" aria-hidden="true">
                <div id="progressBar" class="progress__bar"></div>
            </div>
        </section>
    </main>

    <script>
        const EXAMPLES = [
            `// Process orchestration: synchronous command
let st = run("kubectl", "version", "--client", "--short", {
    maxOutputBytes: 8192,
})

if !st.ok {
    fail("kubectl failed: " + st.error)
}
log(st.output.trim())`,
            `// Streams: kubectl pod phase summary
let p = proc(
    "kubectl", "get", "pods", "-A",
    "-o", "jsonpath={range .items[*]}{.status.phase}{\"\\n\"}{end}",
    { stdout: PIPE, stderr: NULL, stdoutType: TEXT, }
)

let phases = p
    | lines()
    | filter(_ != "")
    | group_count()

wait p
log(phases)`,
            `// Follow process output with stream.read()
let p = proc(
    "kubectl", "logs", "-f", "deploy/api",
    "--tail=20",
    { stdout: PIPE, stderr: NULL, stdoutType: TEXT, }
)

for true with pair = p.stdout.read() {
    let [line, eof] = pair
    if eof { break () }
    if line.contains("ERROR") { log("error", line) }
    pair = p.stdout.read()
} then ()

wait p ? {}`,
            `// Fan-in: merge multiple stream sources
let logA =
    proc(
        "kubectl", "logs", "-f", "deploy/api-a",
        { stdout: PIPE, stderr: NULL, stdoutType: TEXT, }
    ) | lines()
let logB =
    proc(
        "kubectl", "logs", "-f", "deploy/api-b",
        { stdout: PIPE, stderr: NULL, stdoutType: TEXT, }
    ) | lines()

let first100 = merge(logA, logB)
    | filter(_ != "")
    | take(100)
    | collect()

log({ count: len(first100), })`,
            `// Pod logs fan-in in one statement
merge(
  listPods()
    .map(pod ->
      proc(
        "kubectl", "logs", "-f", "-n", ns, pod, "--all-containers=true", "--tail=100",
        { stdout: PIPE, stderr: NULL, stdoutType: TEXT, }
      )
      | lines()
      | filter(_ != "")
      | map(line -> { pod, level: levelOf(line), })
    )
) | forEach(event -> {
    bump(counts, event.pod, event.level)
    if now() - last >= matrixMs {
        render(counts)
        last = now()
    }
})`,
            `// Stream side effects: spill + tee
let n = proc(
    "kubectl", "get", "pods", "-A",
    { stdout: PIPE, stderr: NULL, stdoutType: TEXT, }
)
    | lines()
    | spill("/tmp/pods.snapshot", { type: TEXT, })
    | tee(stdout())
    | count()

log({ lines: n, })`,
            `// Stream -> exec sink
let result = proc(
    "kubectl", "get", "pods", "-A",
    { stdout: PIPE, stderr: NULL, stdoutType: TEXT, }
)
    | lines()
    | filter(_ != "")
    | exec("wc", "-l", { maxOutputBytes: 4096, })

if !result.ok { fail("wc failed") }
log(result.output.trim())`,
            `// HTTP stream source (NDJSON style)
let teams = http("http://127.0.0.1:8080/events", { type: TEXT, })
    | lines()
    | filter(_ != "")
    | fromJson()
    | group_count(_.team)

log(teams)`,
            `// SQL + time + hash
let db = sqlOpen("postgres://vigil:vigil@localhost:5432/vigil?sslmode=disable")
let email = "hello@karl-lang.org"
let fp = sha256(email)

sqlExec(db,
  "INSERT INTO users (id, email, fingerprint, last_email_check) VALUES ($1, $2, $3, $4)",
  [uuidNew(), email, fp, now()]
)
log(sqlQueryOne(db, "SELECT email, fingerprint FROM users WHERE email = $1", [email]))
sqlClose(db)`,
            `// Signal-aware worker lifecycle
let worker = spawn (() -> {
    for true with running = true {
        sleep(1000)
        logt("tick")
    } then ()
})()

let sigs = signalWatch(["SIGINT", "SIGTERM"])
let [sig, done] = sigs.recv()
if !done { log("shutdown:", sig) }

worker.cancel()
wait worker ? {}`,
            `// Recover at IO/parse boundaries
let config = fromJson(readFile("config.json")) ? {
    log("bad config:", error.message)
    { mode: "safe", poll_ms: 1000, }
}

let pollMs = parseInt(str(config.poll_ms)) ? 1000
log({ mode: config.mode, pollMs, })`
        ];

        const KEYWORDS = new Set([
            "let", "if", "else", "match", "case", "for", "with", "then",
            "true", "false", "null", "wait", "spawn", "race", "break"
        ]);

        const tokenRe = /\/\/.*$|"(?:\\.|[^"\\])*"|\b[a-zA-Z_][a-zA-Z0-9_]*(?=\()|\b[a-zA-Z_][a-zA-Z0-9_]*\b|\b\d+(?:\.\d+)?\b|->|!&|&&|\|\||==|!=|<=|>=|[=+\-*/%<>]/gm;

        const el = document.getElementById("example");
        const progressBar = document.getElementById("progressBar");
        const CYCLE_MS = 10000;
        const DECODE_MS = 920;
        const GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*+-=<>?/|~";
        let index = 0;
        let timerId = null;
        let cycleStartAt = 0;
        let remainingMs = CYCLE_MS;
        let isPaused = false;
        let isTransitioning = false;
        let decodeRaf = null;

        const escapeHTML = (s) => s
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

        function highlight(code) {
            tokenRe.lastIndex = 0;
            let out = "";
            let last = 0;

            for (const m of code.matchAll(tokenRe)) {
                const tok = m[0];
                const i = m.index || 0;

                out += escapeHTML(code.slice(last, i));

                let cls = null;
                if (tok.startsWith("//")) {
                    cls = "tok-comment";
                } else if (tok.startsWith("\"")) {
                    cls = "tok-string";
                } else if (/^\d/.test(tok)) {
                    cls = "tok-number";
                } else if (/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(tok) && KEYWORDS.has(tok)) {
                    cls = "tok-keyword";
                } else if (/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(tok)) {
                    const rest = code.slice(i + tok.length);
                    if (/^\s*\(/.test(rest)) {
                        cls = "tok-call";
                    }
                } else if (/^(->|!&|&&|\|\||==|!=|<=|>=|[=+\-*/%<>])$/.test(tok)) {
                    cls = "tok-operator";
                }

                if (cls) {
                    out += `<span class="${cls}">${escapeHTML(tok)}</span>`;
                } else {
                    out += escapeHTML(tok);
                }

                last = i + tok.length;
            }

            out += escapeHTML(code.slice(last));
            return out;
        }

        function render(i) {
            el.innerHTML = highlight(EXAMPLES[i]);
            el.scrollTop = 0;
        }

        function randomGlyph() {
            return GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
        }

        function buildDecodePlan(fromCode, toCode) {
            const maxLen = Math.max(fromCode.length, toCode.length);
            const plan = [];
            for (let i = 0; i < maxLen; i++) {
                const target = toCode[i] || "";
                const norm = maxLen > 1 ? i / (maxLen - 1) : 1;
                const jitter = (Math.random() * 0.18) - 0.09;
                const lockAt = Math.max(0.06, Math.min(0.98, (norm * 0.72) + 0.12 + jitter));
                plan.push({ target, lockAt });
            }
            return plan;
        }

        function renderDecoded(plan, progress) {
            let text = "";
            for (let i = 0; i < plan.length; i++) {
                const slot = plan[i];
                const t = slot.target;
                if (progress >= slot.lockAt) {
                    text += t;
                    continue;
                }
                if (t === "\n" || t === "\r" || t === "\t" || t === " ") {
                    text += t;
                    continue;
                }
                text += randomGlyph();
            }
            el.innerHTML = highlight(text);
            el.scrollTop = 0;
        }

        function decodeTo(nextIndex, onDone) {
            const fromCode = EXAMPLES[index];
            const toCode = EXAMPLES[nextIndex];
            const plan = buildDecodePlan(fromCode, toCode);
            const start = performance.now();

            const step = (now) => {
                const elapsed = now - start;
                const raw = Math.max(0, Math.min(1, elapsed / DECODE_MS));
                const eased = 1 - Math.pow(1 - raw, 3);
                renderDecoded(plan, eased);

                if (raw < 1) {
                    decodeRaf = requestAnimationFrame(step);
                    return;
                }

                decodeRaf = null;
                render(nextIndex);
                onDone();
            };

            if (decodeRaf) {
                cancelAnimationFrame(decodeRaf);
                decodeRaf = null;
            }
            decodeRaf = requestAnimationFrame(step);
        }

        function setProgressStatic(ratio) {
            progressBar.style.transition = "none";
            progressBar.style.transform = `scaleY(${ratio})`;
        }

        function animateProgress(fromRatio, durationMs) {
            progressBar.style.transition = "none";
            progressBar.style.transform = `scaleY(${fromRatio})`;
            void progressBar.offsetWidth;
            progressBar.style.transition = `transform ${durationMs}ms linear`;
            progressBar.style.transform = "scaleY(1)";
        }

        function scheduleNext(delayMs) {
            if (timerId) {
                clearTimeout(timerId);
                timerId = null;
            }
            cycleStartAt = performance.now();
            remainingMs = delayMs;
            const fromRatio = 1 - (delayMs / CYCLE_MS);
            animateProgress(fromRatio, delayMs);
            timerId = setTimeout(() => {
                timerId = null;
                rotateBy(1);
            }, delayMs);
        }

        function rotateBy(step) {
            if (isTransitioning) return;
            isTransitioning = true;
            if (timerId) {
                clearTimeout(timerId);
                timerId = null;
            }
            const nextIndex = (index + step + EXAMPLES.length) % EXAMPLES.length;
            decodeTo(nextIndex, () => {
                index = nextIndex;
                isTransitioning = false;
                if (isPaused) {
                    remainingMs = CYCLE_MS;
                    setProgressStatic(0);
                } else {
                    scheduleNext(CYCLE_MS);
                }
            });
        }

        function pauseLoop() {
            if (isPaused) return;
            isPaused = true;
            if (timerId) {
                clearTimeout(timerId);
                timerId = null;
            }
            const elapsed = Math.max(0, Math.min(CYCLE_MS, performance.now() - cycleStartAt));
            remainingMs = Math.max(0, CYCLE_MS - elapsed);
            setProgressStatic(elapsed / CYCLE_MS);
        }

        function resumeLoop() {
            if (!isPaused) return;
            isPaused = false;
            scheduleNext(remainingMs > 0 ? remainingMs : CYCLE_MS);
        }

        window.addEventListener("keydown", (event) => {
            if (event.metaKey || event.ctrlKey || event.altKey) return;
            const tag = event.target && event.target.tagName ? event.target.tagName : "";
            if (tag === "INPUT" || tag === "TEXTAREA") return;

            if (event.code === "ArrowRight") {
                event.preventDefault();
                rotateBy(1);
                return;
            }
            if (event.code === "ArrowLeft") {
                event.preventDefault();
                rotateBy(-1);
                return;
            }
            if (event.code === "Space") {
                event.preventDefault();
                if (isPaused) {
                    resumeLoop();
                } else {
                    pauseLoop();
                }
            }
        });

        render(index);
        scheduleNext(CYCLE_MS);
    </script>
</body>

</html>
