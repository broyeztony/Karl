name: Graphify Knowledge Graph

# Rebuilds graphify-out/graph.json after code lands on main.
#
# `push` rather than `pull_request: closed`: a merge to main always produces a
# push to main, while pull_request events from a fork get a read-only
# GITHUB_TOKEN and could not push the refreshed graph back.
# `paths-ignore` stops this job's own commit from re-triggering it.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'graphify-out/**'
  workflow_dispatch:

# Two merges landing close together would otherwise race on git push.
concurrency:
  group: graphify-${{ github.ref }}

permissions:
  contents: write

jobs:
  rebuild-graph:
    name: Rebuild code graph
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install graphify
        run: pip install --quiet graphifyy

      - name: Rebuild graph (AST only, no LLM)
        run: |
          set -euo pipefail
          if [ ! -f graphify-out/graph.json ]; then
            echo "::error::graphify-out/graph.json must be committed - it holds the semantic"
            echo "::error::nodes, which CI cannot regenerate without an LLM key. Build it"
            echo "::error::locally with /graphify and commit it first."
            exit 1
          fi
          # Merges code changes into the committed graph, preserving every
          # non-code node already in it. No API key required.
          graphify update .

      - name: Verify semantic nodes survived
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          from collections import Counter
          g = json.load(open('graphify-out/graph.json'))
          types = Counter(n.get('file_type') for n in g['nodes'])
          semantic = sum(v for k, v in types.items() if k != 'code')
          print(f'{len(g["nodes"])} nodes, {len(g.get("links", []))} edges, {dict(types)}')
          if semantic == 0:
              sys.exit('semantic nodes were lost - refusing to commit a code-only graph')
          PY

      - name: Commit refreshed graph
        run: |
          set -euo pipefail
          git add -- graphify-out/graph.json graphify-out/GRAPH_REPORT.md graphify-out/manifest.json
          if git diff --cached --quiet; then
            echo "Graph unchanged - nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # [skip ci] also keeps ci.yml's full matrix off a data-only commit.
          git commit -m "chore(graphify): rebuild knowledge graph [skip ci]"
          git push
