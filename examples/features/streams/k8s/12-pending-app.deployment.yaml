apiVersion: apps/v1
kind: Deployment
metadata:
  name: pending-app
  namespace: karl-health-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pending-app
  template:
    metadata:
      labels:
        app: pending-app
    spec:
      containers:
      - name: pending
        image: busybox:1.36
        command: ["sh", "-c", "sleep 3600"]
        resources:
          requests:
            cpu: "100"
            memory: "8Gi"
