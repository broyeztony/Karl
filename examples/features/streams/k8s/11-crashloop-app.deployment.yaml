apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-app
  namespace: karl-health-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop-app
  template:
    metadata:
      labels:
        app: crashloop-app
    spec:
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "echo boom && sleep 1 && exit 1"]
