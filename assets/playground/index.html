<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Karl</title>
    <style>
        :root {
            --ink: #1e1e1e;
            --accent-a: #bd93f9;
            --accent-b: #ff79c6;
            --line: #e6e6e6;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            font-family: Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-weight: lighter;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            color: var(--ink);
        }

        .page {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
        }

        .left {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            min-height: 0;
        }

        .left a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-decoration: none;
        }

        .left img {
            width: min(44%, 320px);
            height: auto;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        .right {
            border-left: 1px solid var(--line);
            min-width: 0;
            min-height: 0;
            padding: 34px 40px;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            position: relative;
        }

        #example {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            white-space: pre;
            color: var(--ink);
            font-size: clamp(14px, 1.45vw, 24px);
            line-height: 1.55;
            opacity: 1;
            transition: opacity 360ms ease;
        }

        #example.fade {
            opacity: 0;
        }

        .progress {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 4px;
            background: var(--line);
            overflow: hidden;
        }

        .progress__bar {
            width: 100%;
            height: 100%;
            background: var(--accent-a);
            transform: scaleX(0);
            transform-origin: left center;
        }

        .tok-keyword,
        .tok-operator {
            color: var(--accent-a);
        }

        .tok-string,
        .tok-number,
        .tok-call {
            color: var(--accent-b);
        }

        .tok-comment {
            color: var(--ink);
            opacity: 0.58;
        }

        @media (max-width: 980px) {
            .page {
                grid-template-columns: 1fr;
            }

            .left {
                display: none;
            }

            .right {
                border-left: none;
                padding: 18px 16px;
            }

            #example {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <main class="page" aria-label="Karl landing page">
        <section class="left" aria-label="Karl logo">
            <a href="/bench/" aria-label="Open Karl bench playground">
                <img src="karl.png" alt="Karl logo">
            </a>
        </section>
        <section class="right" aria-label="Karl feature examples">
            <pre id="example"></pre>
            <div class="progress" aria-hidden="true">
                <div id="progressBar" class="progress__bar"></div>
            </div>
        </section>
    </main>

    <script>
        const EXAMPLES = [
            `// Concurrency + race
let group = & {
    (() -> { sleep(120); "A done" })(),
    (() -> { sleep(80); "B done" })(),
    (() -> { sleep(40); "C done" })()
}
log(wait group)

let fastest = !& {
    (() -> { sleep(200); "slow" })(),
    (() -> { sleep(30); "fast" })()
}
log(wait fastest)`,
            `// Channels
let c = channel()
spawn (ch -> {
    ch.send("Hello from thread")
    ch.done()
})(c)

log(c.recv()) // ["Hello from thread", false]
log(c.recv()) // [null, true]`,
            `// Strings: indexing + slicing
let text = "karl-language"
let chars = text.split("")
let first = chars[0]
let dash = chars[4]
let left = text[..4]
let right = text[5..]
let last = chars[chars.length - 1]

log({
    first: first,
    dash: dash,
    left: left,
    right: right,
    last: last,
})`,
            `// Match + guards
let score = 87
let rank = match score {
    case _ if score >= 90 -> "A"
    case _ if score >= 80 -> "B"
    case _ if score >= 70 -> "C"
    case _ -> "D"
}
log("rank:", rank)`,
            `// Fibonacci (expression-based loop)
let fib = n -> {
    if n <= 1 { n } else {
        for i < n with i = 1, a = 0, b = 1 {
            let next = a + b
            a = b
            b = next
            i++
        } then b
    }
}
log((0..10).map(fib))`,
            `// File I/O
let path = "notes.txt"
writeFile(path, "hello\\n")
appendFile(path, "from karl\\n")

log(readFile(path))
log("exists:", exists(path))
deleteFile(path)`,
            `// System runtime APIs
let args = argv()
let exe = programPath()
let home = env("HOME")
let all = environ()

log({
    args: args,
    exe: exe,
    home: home,
    env_count: all.length,
})`,
            `// Signal handling
let sigs = signalWatch(["SIGINT", "SIGTERM"])
log("waiting for shutdown...")

let [sig, closed] = sigs.recv()
if !closed {
    log("shutdown:", sig)
}`,
            `// HTTP server
let srv = httpServe({
    addr: ":8080",
    routes: [
        {
            method: "GET",
            path: "/health",
            handler: req -> {
                status: 200,
                headers: { "Content-Type": "application/json", },
                body: jsonEncode({ status: "ok", now: now(), }),
            }
        }
    ],
})`,
            `// SQL + UUID + hash
let db = sqlOpen("postgres://vigil:vigil@localhost:5432/vigil?sslmode=disable")
let id = uuidNew()
let email = "hello@karl-lang.org"
let fp = sha256(email)

sqlExec(db,
  "INSERT INTO users (id, email, fingerprint) VALUES ($1, $2, $3)",
  [id, email, fp]
)
log(sqlQueryOne(db, "SELECT id, email FROM users WHERE id = $1", [id]))`,
            `// Recover operator + match
let cfg = jsonDecode(readFile("config.json")) ? {
    { mode: "safe", retries: 3, }
}

match cfg.mode {
    "safe" -> log("safe mode")
    _ -> log("custom mode")
}`
        ];

        const KEYWORDS = new Set([
            "let", "if", "else", "match", "case", "for", "with", "then",
            "true", "false", "null", "wait", "spawn"
        ]);

        const tokenRe = /\/\/.*$|"(?:\\.|[^"\\])*"|\b[a-zA-Z_][a-zA-Z0-9_]*(?=\()|\b[a-zA-Z_][a-zA-Z0-9_]*\b|\b\d+(?:\.\d+)?\b|->|!&|&&|\|\||==|!=|<=|>=|[=+\-*/%<>]/gm;

        const el = document.getElementById("example");
        const progressBar = document.getElementById("progressBar");
        const CYCLE_MS = 10000;
        const FADE_MS = 360;
        let index = 0;

        const escapeHTML = (s) => s
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

        function highlight(code) {
            tokenRe.lastIndex = 0;
            let out = "";
            let last = 0;

            for (const m of code.matchAll(tokenRe)) {
                const tok = m[0];
                const i = m.index || 0;

                out += escapeHTML(code.slice(last, i));

                let cls = null;
                if (tok.startsWith("//")) {
                    cls = "tok-comment";
                } else if (tok.startsWith("\"")) {
                    cls = "tok-string";
                } else if (/^\d/.test(tok)) {
                    cls = "tok-number";
                } else if (/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(tok) && KEYWORDS.has(tok)) {
                    cls = "tok-keyword";
                } else if (/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(tok)) {
                    const rest = code.slice(i + tok.length);
                    if (/^\s*\(/.test(rest)) {
                        cls = "tok-call";
                    }
                } else if (/^(->|!&|&&|\|\||==|!=|<=|>=|[=+\-*/%<>])$/.test(tok)) {
                    cls = "tok-operator";
                }

                if (cls) {
                    out += `<span class="${cls}">${escapeHTML(tok)}</span>`;
                } else {
                    out += escapeHTML(tok);
                }

                last = i + tok.length;
            }

            out += escapeHTML(code.slice(last));
            return out;
        }

        function render(i) {
            el.innerHTML = highlight(EXAMPLES[i]);
            el.scrollTop = 0;
        }

        function restartProgressBar() {
            progressBar.style.transition = "none";
            progressBar.style.transform = "scaleX(0)";
            // Force style flush so transition reliably restarts.
            void progressBar.offsetWidth;
            progressBar.style.transition = `transform ${CYCLE_MS}ms linear`;
            progressBar.style.transform = "scaleX(1)";
        }

        function nextExample() {
            el.classList.add("fade");
            setTimeout(() => {
                index = (index + 1) % EXAMPLES.length;
                render(index);
                el.classList.remove("fade");
                runLoop();
            }, FADE_MS);
        }

        function runLoop() {
            restartProgressBar();
            setTimeout(nextExample, CYCLE_MS);
        }

        render(index);
        runLoop();
    </script>
</body>

</html>
